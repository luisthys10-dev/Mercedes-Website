<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 392" width="696" height="392">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a06"/>
      <stop offset="100%" stop-color="#040d03"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.03)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="696" height="392" fill="url(#bg)"/>
  <rect width="696" height="392" fill="url(#glow)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="98" x2="696" y2="98" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="196" x2="696" y2="196" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="294" x2="696" y2="294" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="174" y1="0" x2="174" y2="392" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="348" y1="0" x2="348" y2="392" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="522" y1="0" x2="522" y2="392" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Mercedes star (centered, large watermark) -->
  <g transform="translate(348, 196)" opacity="0.07">
    <circle cx="0" cy="0" r="110" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="white" stroke-width="1"/>
    <line x1="0" y1="-110" x2="0" y2="0" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="95" y2="67" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-95" y2="67" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="10" fill="white"/>
  </g>

  <!-- Accent line bottom -->
  <rect x="0" y="388" width="696" height="4" fill="#4CAF50" opacity="0.7"/>

  <!-- Left accent line -->
  <rect x="0" y="0" width="3" height="392" fill="#4CAF50" opacity="0.5"/>

  <!-- Model name -->
  <text x="40" y="290" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="white" opacity="0.95" letter-spacing="-1">G-Klasse</text>

  <!-- Subtitle -->
  <text x="40" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#4CAF50" letter-spacing="2">SUV</text>

  <!-- Shine overlay -->
  <rect width="696" height="392" fill="url(#shine)"/>
</svg>